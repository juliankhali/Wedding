<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Shilan &amp; Aram Invitation</title>
  <meta name="theme-color" content="#062018" />
  <meta name="description" content="You are invited to our wedding." />
  <meta property="og:title" content="You're invited" />
  <meta property="og:description" content="Open your wax-sealed invitation." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Great+Vibes&family=Noto+Naskh+Arabic:wght@400;600&family=Pinyon+Script&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="is-locked">
  <!-- Shared SVG definitions -->
  <svg class="defs" width="0" height="0" aria-hidden="true">
    <defs>
      <symbol id="sun" viewBox="-50 -50 100 100"><g id="sun-g" fill="currentColor"></g></symbol>

      <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8a6524"/><stop offset=".3" stop-color="#e6c677"/><stop offset=".5" stop-color="#fbeab3"/>
        <stop offset=".7" stop-color="#c49a48"/><stop offset="1" stop-color="#8a6524"/>
      </linearGradient>

      <!-- Kilim liner pattern (inside of the envelope) -->
      <pattern id="kilim-liner" width="36" height="36" patternUnits="userSpaceOnUse">
        <rect width="36" height="36" fill="#0b3a2c"/>
        <path d="M18 2 L34 18 L18 34 L2 18 Z" fill="none" stroke="url(#foil)" stroke-width="1.3"/>
        <path d="M18 9 L27 18 L18 27 L9 18 Z" fill="none" stroke="url(#foil)" stroke-width="1"/>
        <path d="M18 14 L22 18 L18 22 L14 18 Z" fill="url(#foil)"/>
        <path d="M0 0 L4 4 M36 0 L32 4 M0 36 L4 32 M36 36 L32 32" stroke="url(#foil)" stroke-width="1"/>
      </pattern>

      <!-- Wax lighting: dome bevel on the blob, raised emblem, pressed disc -->
      <radialGradient id="wax" cx="40%" cy="35%" r="70%">
        <stop offset="0" stop-color="#c3242c"/><stop offset=".55" stop-color="#8f1119"/><stop offset="1" stop-color="#5c070d"/>
      </radialGradient>
      <filter id="wax-dome" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/>
        <feDiffuseLighting in="b" surfaceScale="6" diffuseConstant="1.05" lighting-color="#ffffff" result="d">
          <feDistantLight azimuth="225" elevation="42"/>
        </feDiffuseLighting>
        <feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1.25" result="lit"/>
        <feSpecularLighting in="b" surfaceScale="6" specularConstant="1.1" specularExponent="28" lighting-color="#ffd6cf" result="s">
          <fePointLight x="30" y="12" z="110"/>
        </feSpecularLighting>
        <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
        <feComposite in="lit" in2="SourceAlpha" operator="in" result="lit2"/>
        <feComposite in="lit2" in2="s2" operator="arithmetic" k2="1" k3=".75"/>
      </filter>
      <filter id="wax-press" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="b"/>
        <feDiffuseLighting in="b" surfaceScale="-3" diffuseConstant="1" lighting-color="#ffffff" result="d">
          <feDistantLight azimuth="225" elevation="48"/>
        </feDiffuseLighting>
        <feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1.2" result="lit"/>
        <feComposite in="lit" in2="SourceAlpha" operator="in"/>
      </filter>
      <filter id="wax-emboss" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceAlpha" stdDeviation=".9" result="b"/>
        <feDiffuseLighting in="b" surfaceScale="2.4" diffuseConstant="1.1" lighting-color="#ffffff" result="d">
          <feDistantLight azimuth="225" elevation="40"/>
        </feDiffuseLighting>
        <feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1.3" result="lit"/>
        <feSpecularLighting in="b" surfaceScale="2.4" specularConstant=".8" specularExponent="18" lighting-color="#ffc9c0" result="s">
          <feDistantLight azimuth="225" elevation="40"/>
        </feSpecularLighting>
        <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
        <feComposite in="lit" in2="SourceAlpha" operator="in" result="lit2"/>
        <feComposite in="lit2" in2="s2" operator="arithmetic" k2="1" k3=".6"/>
      </filter>

      <!-- The complete seal artwork (filled in by script.js) -->
      <symbol id="seal-art" viewBox="0 0 160 160"><g id="seal-g"></g></symbol>

      <!-- Seal pieces after it cracks -->
      <clipPath id="piece-1"><polygon points="0,0 84,0 76,34 88,66 71,96 83,126 75,160 0,160"/></clipPath>
      <clipPath id="piece-2"><polygon points="84,0 160,0 160,88 150,90 118,82 88,66 76,34"/></clipPath>
      <clipPath id="piece-3"><polygon points="88,66 118,82 150,90 160,88 160,160 75,160 83,126 71,96"/></clipPath>

      <filter id="paper-noise" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
        <feColorMatrix values="0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .28  0 0 0 .16 0"/>
      </filter>

      <!-- Corner ornament: kilim diamonds and a stepped Kurdish border -->
      <symbol id="corner" viewBox="0 0 80 80">
        <g fill="none" stroke="url(#foil)" stroke-width="1.2">
          <path d="M2 78 V2 H78"/>
          <path d="M8 78 V8 H78" stroke-width=".6"/>
          <path d="M8 40 h6 v-6 h6 v-6 h6 v-6 h6 v-6 h6 v-6 h6"/>
        </g>
        <path d="M8 14 l6 -6 l6 6 l-6 6 z M30 30 l4 -4 l4 4 l-4 4 z M20 44 l3 -3 l3 3 l-3 3 z M44 20 l3 -3 l3 3 l-3 3 z" fill="url(#foil)"/>
      </symbol>
    </defs>
  </svg>

  <!-- ============ The envelope ============ -->
  <section class="scene" id="scene" aria-label="Invitation envelope">
    <div class="scene__light" aria-hidden="true"></div>
    <div class="scene__dust" id="dust" aria-hidden="true"></div>

    <div class="scene__top">
      <div class="langs" role="group" aria-label="Language" data-langs></div>
    </div>

    <div class="scene__stage">
      <p class="scene__welcome">بەخێربێن</p>
      <p class="scene__to" id="scene-to"></p>

      <div class="env-tilt" id="env-tilt">
        <div class="env" id="env">
          <div class="env__shadow" aria-hidden="true"></div>
          <div class="env__back" aria-hidden="true"></div>
          <svg class="env__liner" viewBox="0 0 400 280" preserveAspectRatio="none" aria-hidden="true">
            <path d="M8 6 H392 L200 150 Z" fill="url(#kilim-liner)"/>
          </svg>

          <!-- The invitation card inside -->
          <div class="card" id="card">
            <div class="card__frame">
              <svg class="card__sun" viewBox="-50 -50 100 100" aria-hidden="true"><use href="#sun" x="-50" y="-50" width="100" height="100"/></svg>
              <p class="card__small" data-i18n="together"></p>
              <p class="card__names" data-bind="couple"></p>
              <p class="card__small" data-bind="dateShort"></p>
            </div>
          </div>

          <svg class="env__pocket" viewBox="0 0 400 280" preserveAspectRatio="none" aria-hidden="true">
            <defs>
              <linearGradient id="pk-l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#efe5d1"/><stop offset="1" stop-color="#e4d6bb"/></linearGradient>
              <linearGradient id="pk-r" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#e9dec8"/><stop offset="1" stop-color="#dccdb0"/></linearGradient>
              <linearGradient id="pk-b" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f4ecdb"/><stop offset="1" stop-color="#e8dcc4"/></linearGradient>
              <filter id="fsh" x="-5%" y="-5%" width="110%" height="120%"><feGaussianBlur stdDeviation="3"/></filter>
              <clipPath id="pk-clip"><path d="M0 0 L204 150 L0 280 Z M400 0 L196 150 L400 280 Z M0 280 L200 124 L400 280 Z"/></clipPath>
            </defs>
            <path d="M0 0 L204 150 L0 280 Z" fill="url(#pk-l)"/>
            <path d="M400 0 L196 150 L400 280 Z" fill="url(#pk-r)"/>
            <path d="M0 280 L200 124 L400 280 Z" fill="url(#pk-b)"/>
            <path d="M0 280 L200 124 L400 280" fill="none" stroke="#b9a684" stroke-opacity=".55" stroke-width="1" vector-effect="non-scaling-stroke"/>
            <path d="M0 0 L204 150 M400 0 L196 150" fill="none" stroke="#c7b490" stroke-opacity=".45" stroke-width="1" vector-effect="non-scaling-stroke"/>
            <rect width="400" height="280" filter="url(#paper-noise)" clip-path="url(#pk-clip)"/>
            <path class="pocket__flapshadow" d="M0 0 H400 L200 166 Z" fill="#4a3418" opacity=".32" filter="url(#fsh)" clip-path="url(#pk-clip)"/>
          </svg>

          <!-- Two-part flap so the paper bends as it opens -->
          <div class="flap" id="flap">
            <div class="flap__a" id="flap-a">
              <div class="flap__face flap__face--out flap__a-shape"></div>
              <div class="flap__face flap__face--in flap__a-shape"></div>
              <div class="flap__b" id="flap-b">
                <div class="flap__face flap__face--out flap__b-shape"></div>
                <div class="flap__face flap__face--in flap__b-shape"></div>
              </div>
            </div>
          </div>

          <button class="seal" id="seal" type="button" aria-label="Break the wax seal to open">
            <svg class="seal__whole" viewBox="0 0 160 160" aria-hidden="true"><use href="#seal-art"/>
              <g class="seal__cracks" fill="none" stroke="#2a0306" stroke-linecap="round" stroke-linejoin="round">
                <path class="crack crack--1" pathLength="1" d="M84 0 L76 34 L88 66 L71 96 L83 126 L75 160" stroke-width="2.2"/>
                <path class="crack crack--2" pathLength="1" d="M88 66 L118 82 L150 90 L160 88" stroke-width="1.8"/>
              </g>
            </svg>
            <span class="seal__pieces" aria-hidden="true">
              <svg class="seal__piece" viewBox="0 0 160 160"><g clip-path="url(#piece-1)"><use href="#seal-art"/></g></svg>
              <svg class="seal__piece" viewBox="0 0 160 160"><g clip-path="url(#piece-2)"><use href="#seal-art"/></g></svg>
              <svg class="seal__piece" viewBox="0 0 160 160"><g clip-path="url(#piece-3)"><use href="#seal-art"/></g></svg>
            </span>
          </button>
        </div>
      </div>

      <p class="scene__hint" id="scene-hint"><span data-i18n="tapSeal"></span><span class="scene__sound"> · <span data-i18n="soundOn"></span> ♪</span></p>
    </div>
  </section>

  <!-- ============ The website ============ -->
  <div class="site" id="site" hidden>
    <nav class="nav" id="nav">
      <a class="nav__mono" href="#home" data-bind="monogram" aria-label="Home"></a>
      <div class="nav__links">
        <a href="#story" data-i18n="navStory"></a>
        <a href="#details" data-i18n="navDetails"></a>
        <a href="#location" data-i18n="navLocation"></a>
      </div>
      <div class="nav__end">
        <div class="langs langs--nav" role="group" aria-label="Language" data-langs></div>
        <a class="nav__rsvp" href="#rsvp" data-i18n="navRsvp"></a>
      </div>
    </nav>

    <main>
      <!-- Hero: the invitation card itself -->
      <header class="hero paper" id="home">
        <div class="hero__card">
          <svg class="corner corner--tl" viewBox="0 0 80 80" aria-hidden="true"><use href="#corner"/></svg>
          <svg class="corner corner--tr" viewBox="0 0 80 80" aria-hidden="true"><use href="#corner"/></svg>
          <svg class="corner corner--bl" viewBox="0 0 80 80" aria-hidden="true"><use href="#corner"/></svg>
          <svg class="corner corner--br" viewBox="0 0 80 80" aria-hidden="true"><use href="#corner"/></svg>

          <svg class="hero__sun rise" viewBox="-50 -50 100 100" aria-hidden="true"><use href="#sun" x="-50" y="-50" width="100" height="100"/></svg>
          <p class="kurdish-welcome rise">بەخێربێن</p>
          <p class="caps rise" data-bind="families"></p>
          <p class="caps caps--soft rise" data-i18n="together"></p>
          <h1 class="names rise">
            <span class="foil" data-bind="bride"></span>
            <span class="names__amp" data-bind="amp">&amp;</span>
            <span class="foil" data-bind="groom"></span>
          </h1>
          <p class="hero__honour rise" data-i18n="honour"></p>
          <div class="diamonds rise" aria-hidden="true"><i></i><i></i><i></i></div>
          <p class="hero__date rise" data-bind="dateLong"></p>
          <p class="hero__time rise" data-bind="timeLine"></p>
          <p class="caps caps--soft rise" data-bind="venueCity"></p>
        </div>
        <a class="scroll-cue" href="#story"><span data-i18n="scroll"></span><i></i></a>
      </header>

      <!-- Photo band with quote -->
      <section class="band" aria-label="Quote">
        <div class="band__img"><img id="band-img" alt="" /></div>
        <blockquote class="band__quote reveal"><p data-i18n="quote"></p><cite data-bind="hashtag"></cite></blockquote>
      </section>

      <!-- Invitation message + gallery -->
      <section class="section paper" id="story">
        <div class="wrap">
          <p class="lead reveal" data-i18n="lead"></p>
          <div class="divider reveal" aria-hidden="true"><svg viewBox="-50 -50 100 100"><use href="#sun" x="-50" y="-50" width="100" height="100"/></svg></div>
          <p class="eyebrow reveal" data-i18n="storyEyebrow"></p>
          <h2 class="title reveal" data-i18n="storyTitle"></h2>
          <div class="arches" id="gallery"></div>
        </div>
      </section>

      <!-- Countdown -->
      <section class="section emerald" id="countdown">
        <div class="wrap">
          <p class="eyebrow reveal" data-i18n="countEyebrow"></p>
          <h2 class="title title--light reveal" data-bind="dateShort"></h2>
          <div class="count reveal" id="count">
            <div><b data-u="d">00</b><small data-i18n="days"></small></div>
            <div><b data-u="h">00</b><small data-i18n="hours"></small></div>
            <div><b data-u="m">00</b><small data-i18n="minutes"></small></div>
            <div><b data-u="s">00</b><small data-i18n="seconds"></small></div>
          </div>
          <a class="btn btn--outline reveal" id="cal-link" href="#" target="_blank" rel="noopener" data-i18n="addCal"></a>
        </div>
      </section>

      <!-- Details + programme -->
      <section class="section paper" id="details">
        <div class="wrap">
          <p class="eyebrow reveal" data-i18n="detailsEyebrow"></p>
          <h2 class="title reveal" data-i18n="detailsTitle"></h2>
          <div class="facts">
            <div class="fact reveal"><p class="caps" data-i18n="when"></p><p class="fact__main" data-bind="dateShort"></p><p class="fact__sub" data-bind="timeLine"></p></div>
            <div class="fact reveal"><p class="caps" data-i18n="where"></p><p class="fact__main" data-bind="venueName"></p><p class="fact__sub" data-bind="venueAddress"></p></div>
            <div class="fact reveal"><p class="caps" data-i18n="attire"></p><p class="fact__main" data-i18n="attireValue"></p><p class="fact__sub" data-i18n="attireNote"></p></div>
          </div>
          <h3 class="subtitle reveal" data-i18n="programTitle"></h3>
          <ol class="programme" id="programme"></ol>
        </div>
      </section>

      <!-- Location -->
      <section class="section emerald" id="location">
        <div class="wrap">
          <p class="eyebrow reveal" data-i18n="locationEyebrow"></p>
          <h2 class="title title--light reveal" data-i18n="locationTitle"></h2>
          <p class="venue reveal" data-bind="venueName"></p>
          <p class="venue__addr reveal" data-bind="venueAddress"></p>
          <div class="map reveal" id="map"></div>
          <a class="btn btn--gold reveal" id="directions" href="#" target="_blank" rel="noopener" data-i18n="directions"></a>
        </div>
      </section>

      <!-- RSVP -->
      <section class="section paper" id="rsvp">
        <div class="wrap">
          <div class="reply reveal">
            <p class="eyebrow" data-i18n="rsvpEyebrow"></p>
            <h2 class="title" data-i18n="rsvpTitle"></h2>
            <p class="reply__by" data-bind="rsvpBy"></p>
            <form class="form" id="rsvp-form" novalidate>
              <label class="field"><span data-i18n="name"></span><input id="f-name" name="name" autocomplete="name" data-i18n-ph="namePh" required /></label>
              <div class="choice" role="radiogroup">
                <label><input type="radio" name="attend" id="f-yes" value="yes" checked /><i></i><span data-i18n="accept"></span></label>
                <label><input type="radio" name="attend" id="f-no" value="no" /><i></i><span data-i18n="decline"></span></label>
              </div>
              <label class="field"><span data-i18n="guests"></span>
                <select id="f-guests" name="guests"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select>
              </label>
              <label class="field"><span data-i18n="message"></span><textarea id="f-msg" name="msg" rows="2" data-i18n-ph="messagePh"></textarea></label>
              <a class="btn btn--emerald" id="f-send" href="#" target="_blank" rel="noopener" data-i18n="send"></a>
              <p class="form__note" data-i18n="sendNote"></p>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer emerald">
      <svg class="footer__seal" viewBox="0 0 160 160" aria-hidden="true"><use href="#seal-art"/></svg>
      <p class="footer__names"><span class="foil" data-bind="couple"></span></p>
      <p class="caps caps--light" data-bind="dateShort"></p>
      <p class="footer__bless" data-i18n="blessing"></p>
    </footer>

    <!-- Music: a gold record that spins while playing -->
    <div class="music" id="music">
      <button class="music__disc" id="music-btn" type="button" aria-label="Pause music">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="23" fill="#101010"/>
          <circle cx="24" cy="24" r="19" fill="none" stroke="#2e2e2e" stroke-width=".6"/>
          <circle cx="24" cy="24" r="15.5" fill="none" stroke="#2e2e2e" stroke-width=".6"/>
          <circle cx="24" cy="24" r="12" fill="none" stroke="#2e2e2e" stroke-width=".6"/>
          <circle cx="24" cy="24" r="8.5" fill="url(#foil)"/>
          <circle cx="24" cy="24" r="1.6" fill="#101010"/>
          <path d="M8 16 A18 18 0 0 1 20 7" stroke="#fff" stroke-opacity=".25" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="music__label" id="music-label">
        <small data-i18n="nowPlaying"></small>
        <strong id="song-title"></strong>
        <label class="music__add" id="song-add" hidden><span data-i18n="addSong"></span><input type="file" id="song-file" accept="audio/*" /></label>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>
  </div>

  <audio id="audio" loop preload="auto"></audio>

  <script src="i18n.js"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
