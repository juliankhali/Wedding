<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFE7DC">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<meta property="og:title" content="Sivan &amp; Maswa">
<meta property="og:description" content="We would be delighted to have you join us at our engagement celebration">
<meta property="og:type" content="website">
<title>Sivan &amp; Maswa</title>
<link rel="preload" href="fonts/amiri-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="img/door-l.webp" as="image">
<link rel="stylesheet" href="style.css">
</head>
<body class="locked">

<!-- ===== Shared SVG defs ===== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Plaster / raised-fabric emboss -->
    <filter id="emboss" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.7" result="b"/>
      <feDiffuseLighting in="b" surfaceScale="3" diffuseConstant="1.3" lighting-color="#fff" result="d0"><feDistantLight azimuth="225" elevation="50"/></feDiffuseLighting>
      <feComponentTransfer in="d0" result="d"><feFuncR type="linear" slope=".42" intercept=".6"/><feFuncG type="linear" slope=".42" intercept=".6"/><feFuncB type="linear" slope=".42" intercept=".6"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="d" mode="multiply" result="shaded"/>
      <feComposite in="shaded" in2="SourceAlpha" operator="in" result="body"/>
      <feSpecularLighting in="b" surfaceScale="4" specularConstant=".55" specularExponent="28" lighting-color="#fff" result="s"><feDistantLight azimuth="225" elevation="42"/></feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="spec"/>
      <feOffset in="SourceAlpha" dx="3" dy="4" result="o1"/><feGaussianBlur in="o1" stdDeviation="3.2" result="o2"/>
      <feFlood flood-color="#785A46" flood-opacity=".24"/><feComposite in2="o2" operator="in" result="shadow"/>
      <feOffset in="SourceAlpha" dx="-2.2" dy="-2.2" result="w1"/><feGaussianBlur in="w1" stdDeviation="2" result="w2"/>
      <feFlood flood-color="#fff" flood-opacity=".85"/><feComposite in2="w2" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="shadow"/><feMergeNode in="body"/><feMergeNode in="spec"/></feMerge>
    </filter>
    <filter id="pshadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx=".9" dy="1.2" stdDeviation=".9" flood-color="#785A46" flood-opacity=".4"/></filter>
    <radialGradient id="pearl" cx="34%" cy="30%" r="78%"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#F3EAE1"/><stop offset="1" stop-color="#DCCDC0"/></radialGradient>
    <radialGradient id="petal" cx="38%" cy="30%" r="85%"><stop offset="0" stop-color="#FDFAF6"/><stop offset=".55" stop-color="#F1E9DE"/><stop offset="1" stop-color="#E3D6C8"/></radialGradient>
    <radialGradient id="face" cx="50%" cy="20%" r="90%"><stop offset="0" stop-color="#FBF7F1"/><stop offset="1" stop-color="#F2EADF"/></radialGradient>
  </defs>
</svg>

<!-- ===== Closed lace doors ===== -->
<div id="intro" class="intro" dir="ltr">
  <div class="door left"><img class="door-art" src="img/door-l.webp" alt=""></div>
  <div class="door right"><img class="door-art" src="img/door-r.webp" alt=""></div>
  <div class="intro-ui">
    <button id="seal" class="clasp" aria-label="کردنەوە" data-pearls="oval" data-inset="3" data-r="1.7" data-gap="5.6">
      <span class="clasp-face"><span class="sig" id="sig" dir="ltr"></span></span>
    </button>
    <div class="intro-bottom" dir="rtl">
      <button id="openInvite" class="white-pill"><span data-t="openInvite"></span></button>
    </div>
  </div>
</div>

<button id="muteBtn" class="ctl mute" aria-label="مۆسیقا">
  <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4.5" height="6.5" rx="1.6"/><rect x="16.5" y="14" width="4.5" height="6.5" rx="1.6"/><path class="slash" d="M3 3l18 18"/></svg>
</button>

<!-- ===== Pages (tabs) ===== -->
<main class="phone" id="pages">

  <!-- 1 · Home -->
  <section class="page" data-page="home">
    <div class="stage">
      <div class="frame-bg" aria-hidden="true"></div>
      <div class="copy hero-copy">
        <h2 class="invite seq" style="--i:1" data-t="invite"></h2>
        <p class="occ seq" style="--i:2" data-t="joinLine"></p>
        <h1 class="names">
          <span class="n n1" id="name1"></span>
          <em class="amp seq" style="--i:3">&amp;</em>
          <span class="n n2" id="name2"></span>
        </h1>
      </div>
      <img class="corner tl" src="img/corner-tl.webp" alt="" decoding="async">
      <img class="corner br" src="img/corner-br.webp" alt="" decoding="async">
    </div>
  </section>

  <!-- 2 · Program + ending -->
  <section class="page" data-page="thanks">
    <div class="stage">
      <div class="frame-bg" aria-hidden="true"></div>
      <div class="copy">
        <p class="poem seq" style="--i:0">بە ناوی خودای گەورە و بە دڵێکی پڕ لە خۆشی،<br>بەخێربێن بۆ شەوه تایبەتەکەمان</p>
        <img class="orn seq" style="--i:1" src="img/orn.webp" alt="" decoding="async">
        <p class="poem seq" style="--i:2">ئەمڕۆ چیرۆکێکی نوێ دەست پێدەکات؛<br>چیرۆکی دوو دڵ کە بە خۆشەویستی بەیەک گەیشتوون<br>لەگەڵ ئێوە، خۆشییەکەمان تەواوتره،<br>وە بوونتان لەم شەوەدا<br>جوانترین بەشە لە یادەوەرییەکەمان.</p>
        <p class="poem seq" style="--i:3">بەخێربێن بۆ دەستپێکی<br>چیرۆکی «هەمیشەمان».</p>
      </div>
      <img class="corner tl" src="img/corner-tl.webp" alt="" decoding="async">
      <img class="corner br" src="img/corner-br.webp" alt="" decoding="async">
    </div>
  </section>

  <!-- 3 · Date, time, countdown -->
  <section class="page" data-page="when">
    <div class="stage">
      <div class="frame-bg" aria-hidden="true"></div>
      <div class="copy">
        <h2 class="h seq" style="--i:0" data-t="whenTitle"></h2>
        <ul class="trio seq" style="--i:1">
          <li><span class="ico" data-pearls="oval" data-inset="5" data-r="1.6" data-gap="7"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="22" height="20" rx="3"/><path d="M5 13h22M11 4v6M21 4v6"/><circle cx="12" cy="19" r="1" fill="currentColor"/><circle cx="16" cy="19" r="1" fill="currentColor"/><circle cx="20" cy="19" r="1" fill="currentColor"/></svg></span><p id="iDate"></p></li>
          <li><span class="ico" data-pearls="oval" data-inset="5" data-r="1.6" data-gap="7"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 29s9-8.2 9-15a9 9 0 0 0-18 0c0 6.8 9 15 9 15z"/><circle cx="16" cy="14" r="3.4"/></svg></span><p id="iPlace"></p></li>
          <li><span class="ico" data-pearls="oval" data-inset="5" data-r="1.6" data-gap="7"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="16" r="12"/><path d="M16 9v7l5 3"/></svg></span><p id="iTime"></p></li>
        </ul>
        <p class="accent seq" style="--i:2" data-t="countLine"></p>
        <div class="count seq" style="--i:3" dir="rtl">
          <div class="cell" data-pearls="oval" data-inset="6" data-r="1.7" data-gap="7.6"><b id="cd-d">٠٠</b><small data-t="days"></small></div>
          <div class="cell" data-pearls="oval" data-inset="6" data-r="1.7" data-gap="7.6"><b id="cd-h">٠٠</b><small data-t="hours"></small></div>
          <div class="cell" data-pearls="oval" data-inset="6" data-r="1.7" data-gap="7.6"><b id="cd-m">٠٠</b><small data-t="minutes"></small></div>
          <div class="cell" data-pearls="oval" data-inset="6" data-r="1.7" data-gap="7.6"><b id="cd-s">٠٠</b><small data-t="seconds"></small></div>
        </div>
      </div>
      <img class="corner tl" src="img/corner-tl.webp" alt="" decoding="async">
      <img class="corner br" src="img/corner-br.webp" alt="" decoding="async">
    </div>
  </section>

  <!-- 4 · Venue + map image -->
  <section class="page" data-page="where">
    <div class="stage">
      <div class="frame-bg" aria-hidden="true"></div>
      <div class="copy">
        <h2 class="h seq" style="--i:0" data-t="venueTitle"></h2>
        <div class="map seq" style="--i:1" id="map">
          <!-- Original map illustration (shown when no live Google map is configured) -->
          <svg class="map-art" viewBox="0 0 320 230" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
            <rect width="320" height="230" fill="#EDE5D8"/>
            <path d="M-10 150C60 120 90 190 170 160S280 90 340 120V240H-10Z" fill="#D5E3E6"/>
            <path d="M-10 150C60 120 90 190 170 160S280 90 340 120" fill="none" stroke="#fff" stroke-width="3" opacity=".7"/>
            <rect x="20" y="18" width="70" height="44" rx="8" fill="#DCE3CD"/><rect x="214" y="22" width="84" height="52" rx="8" fill="#DCE3CD"/>
            <g fill="#E4D8C8"><rect x="104" y="16" width="38" height="30" rx="5"/><rect x="152" y="16" width="46" height="30" rx="5"/><rect x="104" y="62" width="38" height="34" rx="5"/><rect x="152" y="62" width="46" height="34" rx="5"/><rect x="20" y="76" width="70" height="30" rx="5"/><rect x="214" y="90" width="38" height="30" rx="5"/><rect x="262" y="90" width="36" height="30" rx="5"/></g>
            <g fill="none" stroke="#fff" stroke-linecap="round"><path d="M0 68H320M0 110H320" stroke-width="7"/><path d="M96 0V230M204 0V230" stroke-width="7"/><path d="M0 40H320M150 0V160" stroke-width="3.5"/></g>
            <path d="M0 110H320M96 0V230" fill="none" stroke="#C9AE85" stroke-width="1.2" stroke-dasharray="1 5" stroke-linecap="round"/>
            <g transform="translate(150 98)"><ellipse cx="0" cy="22" rx="11" ry="4" fill="#785A46" opacity=".25"/><path d="M0 22C-14 4 -18 -2 -18 -10A18 18 0 0 1 18 -10C18 -2 14 4 0 22Z" fill="#C9AE85"/><circle cx="0" cy="-10" r="8.5" fill="url(#pearl)"/></g>
          </svg>
          <iframe id="mapFrame" title="map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" hidden></iframe>
          <a class="map-hit" id="mapHit" target="_blank" rel="noopener" aria-label="Google Maps"><span data-t="mapTap"></span></a>
        </div>
        <p class="venue-name seq" style="--i:2" id="vName"></p>
        <p class="accent seq" style="--i:2" id="vAddress"></p>
        <a id="directions" class="pill seq" style="--i:3" target="_blank" rel="noopener"><span data-t="directions"></span></a>
      </div>
      <img class="corner tl" src="img/corner-tl.webp" alt="" decoding="async">
      <img class="corner br" src="img/corner-br.webp" alt="" decoding="async">
    </div>
  </section>

</main>

<!-- ===== Tab bar + tap tip ===== -->
<div class="hint" id="hint" aria-hidden="true"><span data-t="tapHint"></span><i></i></div>
<nav class="tabs" id="tabs" aria-label="Pages">
  <button id="prevBtn" class="navbtn"><i aria-hidden="true"></i><span data-t="prev"></span></button>
  <button id="nextBtn" class="navbtn next"><span data-t="next"></span><i aria-hidden="true"></i></button>
</nav>

<script src="app.js"></script>
</body>
</html>
