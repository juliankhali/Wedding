<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7FC1EE">
<meta name="robots" content="noindex">
<meta property="og:title" content="سیڤان و مەسوا">
<meta property="og:description" content="بانگهێشتنامە">
<title>Sivan and Mathwa Save the Date</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage" id="stage">
  <div class="scene" id="scene">

    <!-- ============ ILLUSTRATION (all original SVG) ============ -->
    <svg class="art" viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6DB6EA"/><stop offset=".55" stop-color="#A9D8F5"/><stop offset="1" stop-color="#DDF0FB"/></linearGradient>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8E7A8"/><stop offset=".45" stop-color="#D9AE4E"/><stop offset="1" stop-color="#A97A24"/></linearGradient>
        <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5DE92"/><stop offset=".5" stop-color="#D2A33F"/><stop offset="1" stop-color="#9C6F1F"/></linearGradient>
        <radialGradient id="crystal" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#CDEBFA"/><stop offset="1" stop-color="#8EC3E6"/></radialGradient>
        <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9CCB7C"/><stop offset="1" stop-color="#5F9A4C"/></linearGradient>
        <radialGradient id="glow" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
        <radialGradient id="peonyB" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#9DB8EE"/><stop offset="1" stop-color="#4C6FC4"/></radialGradient>
        <pattern id="sash" width="12" height="18" patternUnits="userSpaceOnUse"><rect width="12" height="18" fill="#7A4A2C"/><path d="M0 4H12M0 14H12" stroke="#E7C66B" stroke-width="2"/><path d="M6 6L10 9L6 12L2 9Z" fill="#F1E4C4"/><circle cx="6" cy="9" r="1.2" fill="#B33A3A"/></pattern>
        <pattern id="emb" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.1" fill="#D9AE4E"/></pattern>
      </defs>

      <rect width="360" height="640" fill="url(#sky)"/>
      <g fill="#fff" opacity=".55"><ellipse cx="60" cy="250" rx="60" ry="14"/><ellipse cx="300" cy="330" rx="70" ry="16"/><ellipse cx="180" cy="470" rx="90" ry="14"/></g>

      <!-- ground -->
      <path d="M0 548C80 520 280 520 360 548V640H0Z" fill="url(#grass)"/>
      <path d="M0 585C100 560 260 560 360 585V640H0Z" fill="#74AE5C" opacity=".9"/>
      <g class="steps">
        <rect x="118" y="606" width="124" height="14" rx="4" fill="#fff"/><rect x="132" y="592" width="96" height="14" rx="4" fill="#F4F8FB"/><rect x="146" y="578" width="68" height="14" rx="4" fill="#fff"/>
        <path d="M118 620H242M132 606H228M146 592H214" stroke="#C9D8E3" stroke-width="1"/>
      </g>
      <g class="petals" fill="#fff"><path d="M12 575c-14-24 8-46 22-40 4 22-4 38-22 40z" opacity=".95"/><path d="M-4 600c10-26 40-30 46-14-12 18-30 22-46 14z" opacity=".9"/><path d="M348 575c14-24-8-46-22-40-4 22 4 38 22 40z" opacity=".95"/><path d="M364 600c-10-26-40-30-46-14 12 18 30 22 46 14z" opacity=".9"/></g>

      <!-- gazebo: round gold arch covered in flowers -->
      <g class="gazebo" id="gazebo">
        <circle cx="180" cy="290" r="106" fill="url(#glow)"/>
        <ellipse cx="180" cy="396" rx="96" ry="14" fill="#6FA85A"/>
        <circle cx="180" cy="290" r="106" fill="none" stroke="url(#gold)" stroke-width="6"/>
        <circle cx="180" cy="290" r="98" fill="none" stroke="#C99A3B" stroke-width="1.4"/>
        <g id="garland"></g>
      </g>

      <!-- couple (faces left blank) -->
      <g class="groom" id="groom" transform="translate(88 244) scale(.76)">
        <ellipse cx="50" cy="198" rx="40" ry="6" fill="#3D6B33" opacity=".35"/>
        <ellipse cx="38" cy="196" rx="10" ry="4.5" fill="#2A2420"/><ellipse cx="62" cy="196" rx="10" ry="4.5" fill="#2A2420"/>
        <path d="M22 112C12 146 22 180 33 193L47 193L50 142L53 193L67 193C78 180 88 146 78 112Z" fill="#6E6E45"/>
        <path d="M50 142L47 193M50 142L53 193" stroke="#585835" stroke-width="1.2"/>
        <path d="M27 52C27 42 73 42 73 52L77 114L23 114Z" fill="#8D8D5B"/>
        <path d="M27 54L14 108L25 112L35 68Z" fill="#82824F"/><path d="M73 54L86 108L75 112L65 68Z" fill="#82824F"/>
        <rect x="21" y="98" width="58" height="19" rx="3" fill="url(#sash)"/>
        <path d="M21 98H79M21 117H79" stroke="#E7C66B" stroke-width="1.2"/>
        <path d="M42 46L50 62L58 46Z" fill="#F3E8D8"/>
        <circle cx="19" cy="110" r="5" fill="#E8B896"/><circle cx="81" cy="110" r="5" fill="#E8B896"/>
        <rect x="44" y="36" width="12" height="12" rx="3" fill="#E1AE8A"/>
        <ellipse cx="50" cy="26" rx="14" ry="16" fill="#EDBE9C"/>
        <path d="M35 24C34 6 66 6 65 24C61 15 39 15 35 24Z" fill="#2B1E18"/>
        <path d="M30 118V150M36 118V150" stroke="#7A7A4F" stroke-width="0" />
      </g>
      <g class="bride" id="bride" transform="translate(180 244) scale(.76)">
        <ellipse cx="50" cy="198" rx="48" ry="6" fill="#3D6B33" opacity=".35"/>
        <path d="M32 30C26 62 31 88 38 98L62 98C69 88 74 62 68 30Z" fill="#3A2418"/>
        <path d="M33 84C28 120 8 170 4 198L96 198C92 170 72 120 67 84Z" fill="#C6DEF1"/>
        <path d="M33 84C28 120 8 170 4 198L96 198C92 170 72 120 67 84Z" fill="url(#emb)" opacity=".8"/>
        <path d="M6 192Q50 204 94 192" stroke="#fff" stroke-width="3" fill="none" stroke-dasharray="1 3.5" stroke-linecap="round"/>
        <path d="M36 48C36 43 64 43 64 48L67 88L33 88Z" fill="#BCD8EE"/>
        <path d="M34 48L25 100L17 156L36 158L41 88L44 56Z" fill="#1F2D5C"/><path d="M66 48L75 100L83 156L64 158L59 88L56 56Z" fill="#1F2D5C"/>
        <path d="M34 50L21 102L30 106L40 66Z" fill="#26376F"/><path d="M66 50L79 102L70 106L60 66Z" fill="#26376F"/>
        <path d="M44 56L41 88L36 158M56 56L59 88L64 158" stroke="#D9AE4E" stroke-width="1.6" fill="none"/>
        <rect x="33" y="84" width="34" height="5" rx="2" fill="url(#goldV)"/><circle cx="50" cy="86.5" r="3.4" fill="#F5DE92" stroke="#B98A2E" stroke-width=".8"/>
        <path d="M41 49Q50 62 59 49" stroke="#D9AE4E" stroke-width="1.8" fill="none"/><circle cx="50" cy="59" r="2" fill="#D9AE4E"/>
        <circle cx="26" cy="108" r="4.6" fill="#E8B896"/><circle cx="74" cy="108" r="4.6" fill="#E8B896"/>
        <g class="bouquet"><path d="M50 128L44 108M50 128L56 108" stroke="#5E9B4C" stroke-width="2.4"/><circle cx="42" cy="104" r="7" fill="#EB9DB2"/><circle cx="52" cy="99" r="8" fill="#F4B9C8"/><circle cx="60" cy="106" r="7" fill="#E9879F"/><circle cx="50" cy="109" r="6" fill="#fff"/><circle cx="46" cy="100" r="3" fill="#F7CBD6"/><circle cx="56" cy="103" r="3" fill="#F7CBD6"/></g>
        <rect x="44" y="36" width="12" height="12" rx="3" fill="#E1AE8A"/>
        <ellipse cx="50" cy="27" rx="14" ry="16.5" fill="#EDBE9C"/>
        <path d="M34 26C33 6 67 6 66 26C61 15 39 15 34 26Z" fill="#3A2418"/>
        <circle cx="62" cy="14" r="3" fill="#D9AE4E"/>
      </g>

      <!-- two gold crystal chandeliers -->
      <g class="chand cl" id="chandL" transform="translate(78 0)"></g>
      <g class="chand cr" id="chandR" transform="translate(282 0)"></g>
    </svg>

    <canvas id="snow" class="snow" aria-hidden="true"></canvas>

    <!-- ============ TEXT (editable in app.js) ============ -->
    <div class="title">
      <p class="std t1">SAVE THE DATE</p>
      <h1 class="invite t2" id="invite"></h1>
      <p class="occ t3" id="occasion"></p>
      <h2 class="names t4"><span id="n1"></span><i>&amp;</i><span id="n2"></span></h2>
    </div>
    <ul class="info">
      <li class="t5"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="22" height="20" rx="3"/><path d="M5 13h22M11 4v6M21 4v6"/><circle cx="12" cy="19" r="1" fill="currentColor"/><circle cx="16" cy="19" r="1" fill="currentColor"/><circle cx="20" cy="19" r="1" fill="currentColor"/></svg><p id="iDate"></p></li>
      <li class="t6"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 29s9-8.2 9-15a9 9 0 0 0-18 0c0 6.8 9 15 9 15z"/><circle cx="16" cy="14" r="3.4"/></svg><p id="iPlace"></p></li>
      <li class="t7"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="16" r="12"/><path d="M16 9v7l5 3"/></svg><p id="iTime"></p></li>
    </ul>
    <div class="mono t8" id="mono" dir="ltr"></div>
  </div>

  <div class="ctls">
    <button id="replay" class="ctl" aria-label="Replay"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v4.5h4.5"/></svg></button>
    <button id="mute" class="ctl muted" aria-label="Music"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4.5" height="6.5" rx="1.6"/><rect x="16.5" y="14" width="4.5" height="6.5" rx="1.6"/><path class="slash" d="M3 3l18 18"/></svg></button>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
