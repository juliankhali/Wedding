<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFE7DC">
<title>Lace and Pearl Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="locked">

<!-- ===== Shared SVG defs ===== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Plaster / raised-fabric emboss: relief shading + specular edge + top-left glow + bottom-right shadow -->
    <filter id="emboss" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.7" result="b"/>
      <feDiffuseLighting in="b" surfaceScale="3" diffuseConstant="1.3" lighting-color="#fff" result="d0"><feDistantLight azimuth="225" elevation="50"/></feDiffuseLighting>
      <feComponentTransfer in="d0" result="d"><feFuncR type="linear" slope=".42" intercept=".6"/><feFuncG type="linear" slope=".42" intercept=".6"/><feFuncB type="linear" slope=".42" intercept=".6"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="d" mode="multiply" result="shaded"/>
      <feComposite in="shaded" in2="SourceAlpha" operator="in" result="body"/>
      <feSpecularLighting in="b" surfaceScale="4" specularConstant=".55" specularExponent="28" lighting-color="#fff" result="s"><feDistantLight azimuth="225" elevation="42"/></feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="spec"/>
      <feOffset in="SourceAlpha" dx="3" dy="4" result="o1"/><feGaussianBlur in="o1" stdDeviation="3.2" result="o2"/>
      <feFlood flood-color="#785A46" flood-opacity=".24"/><feComposite in2="o2" operator="in" result="shadow"/>
      <feOffset in="SourceAlpha" dx="-2.2" dy="-2.2" result="w1"/><feGaussianBlur in="w1" stdDeviation="2" result="w2"/>
      <feFlood flood-color="#fff" flood-opacity=".85"/><feComposite in2="w2" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="shadow"/><feMergeNode in="body"/><feMergeNode in="spec"/></feMerge>
    </filter>
    <filter id="pshadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx=".9" dy="1.2" stdDeviation=".9" flood-color="#785A46" flood-opacity=".4"/></filter>
    <radialGradient id="pearl" cx="34%" cy="30%" r="78%"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#F3EAE1"/><stop offset="1" stop-color="#DCCDC0"/></radialGradient>
    <radialGradient id="petal" cx="38%" cy="30%" r="85%"><stop offset="0" stop-color="#FDFAF6"/><stop offset=".55" stop-color="#F1E9DE"/><stop offset="1" stop-color="#E3D6C8"/></radialGradient>
    <radialGradient id="face" cx="50%" cy="20%" r="90%"><stop offset="0" stop-color="#FBF7F1"/><stop offset="1" stop-color="#F2EADF"/></radialGradient>
    <symbol id="lace-tl" viewBox="0 0 260 260" overflow="visible"></symbol>
    <symbol id="lace-br" viewBox="0 0 260 260" overflow="visible"></symbol>
    <symbol id="orn" viewBox="0 0 220 50" overflow="visible"></symbol>
    <symbol id="sprig" viewBox="0 0 40 64" overflow="visible"></symbol>
  </defs>
</svg>

<!-- ===== SCREEN 1: closed lace doors ===== -->
<div id="intro" class="intro">
  <div class="door left"><svg class="door-art" id="artL" viewBox="0 0 195 844" preserveAspectRatio="xMidYMid slice"></svg></div>
  <div class="door right"><svg class="door-art" id="artR" viewBox="0 0 195 844" preserveAspectRatio="xMidYMid slice"></svg></div>
  <div class="intro-ui">
    <button id="seal" class="clasp" aria-label="Open invitation" data-pearls="oval" data-inset="3" data-r="1.7" data-gap="5.6">
      <span class="clasp-face"><svg class="sprig" viewBox="0 0 40 64" aria-hidden="true"><use href="#sprig"/></svg></span>
    </button>
    <div class="intro-bottom">
      <div class="frost" id="introDate"></div>
      <button id="openInvite" class="white-pill"><span data-i18n="openInvite"></span></button>
    </div>
  </div>
</div>

<!-- ===== Controls ===== -->
<button id="langBtn" class="ctl lang" aria-label="Language">EN</button>
<button id="muteBtn" class="ctl mute" aria-label="Music on/off">
  <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4.5" height="6.5" rx="1.6"/><rect x="16.5" y="14" width="4.5" height="6.5" rx="1.6"/><path class="slash" d="M3 3l18 18"/></svg>
</button>

<main class="phone" id="page">

  <!-- SCREEN 2: reveal -->
  <section class="hero" id="hero">
    <div class="stage" id="stage">
      <svg class="frame-svg" id="frameSvg" aria-hidden="true"></svg>
      <div class="hero-copy">
        <p class="kicker seq" style="--i:0" data-i18n="heroKicker"></p>
        <h1 class="names seq" style="--i:1"><span id="name1"></span><em class="amp">&amp;</em><span id="name2"></span></h1>
        <p class="hero-date seq" style="--i:2" id="heroDate"></p>
      </div>
      <a href="#when" class="white-pill bob seq" style="--i:3" id="scrollBtn"><span data-i18n="scrollDown"></span> <b aria-hidden="true">&darr;</b></a>
      <svg class="corner tl" viewBox="0 0 260 260" aria-hidden="true"><use href="#lace-tl"/></svg>
      <svg class="corner br" viewBox="0 0 260 260" aria-hidden="true"><use href="#lace-br"/></svg>
    </div>
  </section>

  <!-- Date + time -->
  <section class="sec" id="when">
    <h2 class="h reveal" data-i18n="whenTitle"></h2>
    <div class="badges reveal">
      <div class="badge" data-pearls="oval" data-inset="6" data-r="1.9" data-gap="8"><small id="bDayLbl"></small><b id="bDate"></b></div>
      <div class="badge" data-pearls="oval" data-inset="6" data-r="1.9" data-gap="8"><small data-i18n="time"></small><b id="bTime"></b></div>
    </div>
  </section>

  <!-- Countdown -->
  <section class="sec" id="countdown">
    <h2 class="h reveal" data-i18n="countTitle"></h2>
    <p class="accent reveal" data-i18n="countLine"></p>
    <div class="count reveal">
      <div class="cell" data-pearls="oval" data-inset="6" data-r="1.7" data-gap="7.6"><b id="cd-d">00</b><small data-i18n="days"></small></div>
      <div class="cell" data-pearls="oval" data-inset="6" data-r="1.7" data-gap="7.6"><b id="cd-h">00</b><small data-i18n="hours"></small></div>
      <div class="cell" data-pearls="oval" data-inset="6" data-r="1.7" data-gap="7.6"><b id="cd-m">00</b><small data-i18n="minutes"></small></div>
      <div class="cell" data-pearls="oval" data-inset="6" data-r="1.7" data-gap="7.6"><b id="cd-s">00</b><small data-i18n="seconds"></small></div>
    </div>
  </section>

  <!-- Venue -->
  <section class="sec" id="venue">
    <div class="panel reveal">
      <h2 class="h" data-i18n="venueTitle"></h2>
      <p class="venue-name" id="vName"></p>
      <p class="accent" id="vAddress"></p>
      <a id="directions" class="pill" target="_blank" rel="noopener"><span data-i18n="directions"></span></a>
    </div>
  </section>

  <!-- Program timeline -->
  <section class="sec" id="program">
    <h2 class="h reveal" data-i18n="programTitle"></h2>
    <ol class="timeline" id="timeline"></ol>
  </section>

  <!-- Memory wall -->
  <section class="sec" id="gallery">
    <h2 class="h reveal" data-i18n="galleryTitle"></h2>
    <p class="accent reveal" data-i18n="galleryLine"></p>
    <div class="wall" id="wall"></div>
    <label class="pill reveal" for="upload"><span data-i18n="upload"></span></label>
    <input id="upload" type="file" accept="image/*" multiple hidden>
  </section>

  <!-- RSVP -->
  <section class="sec" id="rsvp">
    <div class="panel reveal">
      <h2 class="h" data-i18n="rsvpTitle"></h2>
      <p class="accent" id="rsvpLine"></p>
      <form id="rsvpForm" class="form" novalidate>
        <label class="fld"><span data-i18n="fName"></span><input id="fName" name="name" autocomplete="name"></label>
        <div class="fld"><span data-i18n="fGuests"></span>
          <div class="stepper"><button type="button" id="gMinus" aria-label="-">&minus;</button><output id="gOut">1</output><button type="button" id="gPlus" aria-label="+">+</button></div>
        </div>
        <div class="fld"><span data-i18n="fAttending"></span>
          <div class="pills">
            <label class="opt"><input type="radio" name="attending" value="yes" checked><span data-i18n="yes"></span></label>
            <label class="opt"><input type="radio" name="attending" value="no"><span data-i18n="no"></span></label>
          </div>
        </div>
        <button class="pill" type="submit"><span data-i18n="send"></span></button>
        <p class="thanks" id="rsvpThanks" hidden></p>
      </form>
    </div>
  </section>

  <!-- Ending -->
  <footer class="sec foot" id="footer">
    <svg class="orn reveal" viewBox="0 0 220 50" aria-hidden="true"><use href="#orn"/></svg>
    <p class="names small reveal"><span id="fName1"></span><em class="amp">&amp;</em><span id="fName2"></span></p>
    <p class="accent big reveal" id="footThanks"></p>
    <p class="tiny reveal" id="footDate"></p>
  </footer>
</main>

<script src="app.js"></script>
</body>
</html>
