<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3EAE1">
<title>Lace &amp; Pearl Wedding Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="locked">

<!-- ================= Shared SVG defs: emboss filter, pearl gradient, lace cluster ================= -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Embossed look: soft specular highlight (top-left light) + low shadow (bottom-right) -->
    <filter id="emboss" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="3" specularConstant="1" specularExponent="22" lighting-color="#ffffff" result="spec">
        <feDistantLight azimuth="225" elevation="48"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="hi"/>
      <feOffset in="SourceAlpha" dx="1.4" dy="2" result="off"/>
      <feGaussianBlur in="off" stdDeviation="1.6" result="sh"/>
      <feFlood flood-color="#6B5A4E" flood-opacity=".38"/>
      <feComposite in2="sh" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/><feMergeNode in="hi"/></feMerge>
    </filter>
    <radialGradient id="pearl" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#F6EEE6"/><stop offset="1" stop-color="#CDB9A6"/>
    </radialGradient>
    <!-- Original lace floral cluster, built in app.js -->
    <symbol id="lace-cluster" viewBox="0 0 220 220" overflow="visible"></symbol>
  </defs>
</svg>

<!-- ================= Fixed decoration layer (lace in two corners) ================= -->
<div class="decor" aria-hidden="true">
  <svg class="corner tl" viewBox="0 0 220 220"><use href="#lace-cluster"/></svg>
  <svg class="corner br" viewBox="0 0 220 220"><use href="#lace-cluster"/></svg>
</div>

<!-- ================= 1. INTRO: lace doors + mother-of-pearl seal ================= -->
<div id="intro" class="intro">
  <div class="door left"><span class="door-edge"></span></div>
  <div class="door right"><span class="door-edge"></span></div>
  <div class="intro-frame" aria-hidden="true"></div>
  <div class="intro-center">
    <p class="intro-kicker" data-i18n="introKicker"></p>
    <button id="seal" class="seal" aria-label="Open invitation">
      <span class="seal-ring"></span>
      <span class="seal-core"><span id="sealInitials"></span></span>
    </button>
    <p class="intro-hint" data-i18n="introHint"></p>
  </div>
</div>

<!-- ================= Top-right controls ================= -->
<div class="controls" id="controls">
  <button id="langBtn" class="ctl" aria-label="Language">EN</button>
  <button id="muteBtn" class="ctl" aria-label="Music on/off">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="slash" d="M3 3l18 18"/></svg>
  </button>
</div>

<!-- ================= Page ================= -->
<main class="phone" id="page">

  <!-- 2. HERO -->
  <section class="hero" id="hero">
    <div class="arch">
      <div class="arch-inner">
        <p class="eyebrow reveal" data-i18n="heroInvite"></p>
        <h1 class="names reveal">
          <span id="name1"></span>
          <em class="amp">&amp;</em>
          <span id="name2"></span>
        </h1>
        <p class="accent reveal" data-i18n="heroLine"></p>
        <div class="badges reveal">
          <span class="badge" id="badgeDate"></span>
          <span class="badge" id="badgeTime"></span>
        </div>
        <p class="weekday reveal" id="heroDay"></p>
      </div>
    </div>
    <div class="scroll-cue" aria-hidden="true"><span></span></div>
  </section>

  <!-- 3. COUNTDOWN -->
  <section class="block" id="countdown">
    <h2 class="h reveal" data-i18n="countTitle"></h2>
    <p class="accent reveal" data-i18n="countLine"></p>
    <div class="count reveal" id="countGrid">
      <div class="cell"><b id="cd-d">00</b><small data-i18n="days"></small></div>
      <div class="cell"><b id="cd-h">00</b><small data-i18n="hours"></small></div>
      <div class="cell"><b id="cd-m">00</b><small data-i18n="minutes"></small></div>
      <div class="cell"><b id="cd-s">00</b><small data-i18n="seconds"></small></div>
    </div>
  </section>

  <!-- 4. DETAILS + VENUE -->
  <section class="block" id="details">
    <h2 class="h reveal" data-i18n="detailsTitle"></h2>
    <div class="divider reveal"><i></i></div>
    <div class="detail reveal"><small data-i18n="when"></small><p id="dWhen"></p></div>
    <div class="detail reveal"><small data-i18n="where"></small><p id="dVenue" class="big"></p><p id="dAddress"></p></div>
    <div class="detail reveal"><small data-i18n="program"></small><ul id="dProgram" class="program"></ul></div>
    <a id="directions" class="btn reveal" target="_blank" rel="noopener" data-i18n="directions"></a>
  </section>

  <!-- 5. RSVP -->
  <section class="block" id="rsvp">
    <h2 class="h reveal" data-i18n="rsvpTitle"></h2>
    <p class="accent reveal" id="rsvpLine"></p>
    <form id="rsvpForm" class="form reveal" novalidate>
      <label><span data-i18n="fName"></span><input id="fName" name="name" required autocomplete="name"></label>
      <div class="field">
        <span data-i18n="fGuests"></span>
        <div class="stepper">
          <button type="button" id="gMinus" aria-label="-">&minus;</button>
          <output id="gOut">1</output>
          <button type="button" id="gPlus" aria-label="+">+</button>
        </div>
      </div>
      <div class="field">
        <span data-i18n="fAttending"></span>
        <div class="pills">
          <label class="pill"><input type="radio" name="attending" value="yes" checked><span data-i18n="yes"></span></label>
          <label class="pill"><input type="radio" name="attending" value="no"><span data-i18n="no"></span></label>
        </div>
      </div>
      <button class="btn solid" type="submit" data-i18n="send"></button>
      <p class="thanks" id="rsvpThanks" hidden></p>
    </form>
  </section>

  <!-- 6. GALLERY / MEMORY WALL -->
  <section class="block" id="gallery">
    <h2 class="h reveal" data-i18n="galleryTitle"></h2>
    <p class="accent reveal" data-i18n="galleryLine"></p>
    <div class="wall" id="wall"></div>
  </section>

  <!-- 7. FOOTER -->
  <footer class="block foot" id="footer">
    <div class="divider reveal"><i></i></div>
    <p class="accent big reveal" id="footThanks"></p>
    <p class="names small reveal"><span id="fName1"></span> <em class="amp">&amp;</em> <span id="fName2"></span></p>
    <p class="tiny reveal" id="footDate"></p>
  </footer>
</main>

<script src="app.js"></script>
</body>
</html>
